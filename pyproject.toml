[project]
name = "blogging-platform-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emerson Joaquim Tito Albino", email = "ealbino@c2r8s1.42luanda.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
blogging-platform-api = "blogging_platform_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
